name: Release (Windows MSI)

# Builds the Windows installer with jpackage, which needs Windows and WiX 3, so it runs on a
# GitHub-hosted Windows runner (the self-hosted one is Linux only).
# On every push to main it builds the MSI and publishes the GitHub release v<pom version>,
# unless that release already exists.
#
# The steps use Windows PowerShell and the GitHub REST API only, so they do not depend on
# Git Bash, PowerShell 7 or the gh CLI being on the PATH.

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  WIX_URL: https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip

defaults:
  run:
    shell: powershell

jobs:
  msi:
    name: Build MSI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install WiX 3
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          # The binaries zip needs no admin rights; it is kept in the runner tool cache between runs
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wix = Join-Path $env:RUNNER_TOOL_CACHE "wix-3.14.1"
            if (-not (Test-Path (Join-Path $wix "candle.exe"))) {
              $zip = Join-Path $env:RUNNER_TEMP "wix.zip"
              Invoke-WebRequest $env:WIX_URL -OutFile $zip -UseBasicParsing
              Expand-Archive $zip -DestinationPath $wix -Force
            }
            Add-Content -Path $env:GITHUB_PATH -Value $wix
          }

      - name: Read version
        id: ver
        run: |
          $ErrorActionPreference = "Stop"
          $version = (& .\mvnw.cmd -q -DforceStdout help:evaluate "-Dexpression=project.version" | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $version) { throw "Could not read the project version" }
          Write-Host "Version $version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=v$version"

      - name: Check whether the release exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $url = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/${{ steps.ver.outputs.tag }}"
          $exists = "true"
          try {
            Invoke-RestMethod -Uri $url -Headers $headers | Out-Null
            Write-Host "Release ${{ steps.ver.outputs.tag }} already exists, nothing to do"
          } catch {
            if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 404) { $exists = "false" } else { throw }
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "release=$exists"

      - name: Build the installer
        if: steps.exists.outputs.release == 'false'
        run: |
          & .\mvnw.cmd -B install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish the release
        if: steps.exists.outputs.release == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $msi = Get-ChildItem target\dist\*.msi | Select-Object -First 1
          if (-not $msi) { throw "No MSI in target\dist" }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }

          $body = @{
            tag_name               = "${{ steps.ver.outputs.tag }}"
            target_commitish       = "$env:GITHUB_SHA"
            name                   = "ConnLab ${{ steps.ver.outputs.version }}"
            generate_release_notes = $true
          } | ConvertTo-Json
          $release = Invoke-RestMethod -Method Post -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases" `
              -Headers $headers -Body $body -ContentType "application/json"

          $upload = $release.upload_url -replace "\{.*\}$", ""
          Invoke-RestMethod -Method Post -Uri "$($upload)?name=$($msi.Name)" -Headers $headers `
              -InFile $msi.FullName -ContentType "application/octet-stream" | Out-Null
          Write-Host "Published $($release.html_url) with $($msi.Name)"
