name: Release (Windows MSI)

# On every push to main it builds the Windows installer and publishes the GitHub release
# v<pom version>, unless that release already exists.
#
# It runs on the self-hosted Linux runner: .github/release/build-msi.sh builds the MSI without
# Windows (jlink with the jmods of the Windows JDK, the jpackage launcher and wixl).

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  msi:
    name: Build MSI
    runs-on: [ self-hosted, linux, connlab ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # resedit, which gives the launcher its icon and version, needs Node.js 20 or later
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read version
        id: ver
        run: |
          version="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          [ -n "$version" ] || { echo "Could not read the project version" >&2; exit 1; }
          echo "Version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether the release exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          case "$code" in
            200) echo "Release $TAG already exists, nothing to do"; echo "release=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "release=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected HTTP $code looking for release $TAG" >&2; exit 1 ;;
          esac

      - name: Build the installer
        id: msi
        if: steps.exists.outputs.release == 'false'
        run: |
          .github/release/build-msi.sh > "$RUNNER_TEMP/msi-path"
          echo "path=$(tail -1 "$RUNNER_TEMP/msi-path")" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.exists.outputs.release == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          MSI: ${{ steps.msi.outputs.path }}
        run: |
          api() { curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          body="$(jq -n --arg tag "$TAG" --arg sha "$GITHUB_SHA" --arg name "ConnLab $VERSION" \
            '{tag_name: $tag, target_commitish: $sha, name: $name, generate_release_notes: true}')"
          release="$(api -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" -d "$body")"
          upload="$(jq -r .upload_url <<< "$release")"
          upload="${upload%%\{*}"
          api -X POST -H "Content-Type: application/octet-stream" --data-binary "@$MSI" \
            "$upload?name=$(basename "$MSI")" > /dev/null
          echo "Published $(jq -r .html_url <<< "$release") with $(basename "$MSI")"
